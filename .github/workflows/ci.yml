name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # There are no dependencies. npm is only a task runner here, so there is
      # deliberately no install step.
      - name: Syntax-check every module
        run: npm run check
      - name: Unit tests
        run: npm test
      # The bundler is where two modules declaring the same top-level name is
      # caught — legal in the browser, a SyntaxError in the flattened file.
      - name: Single-file build
        run: npm run bundle:demo
