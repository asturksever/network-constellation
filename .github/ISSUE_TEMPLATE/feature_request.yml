name: An idea
description: Something the tool should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The question you want to answer about your network, or the thing that gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: The tool runs in the browser and sends nothing without a key and a click. Ideas that keep it that way are much easier to take.
      options:
        - label: This idea works without sending anyone's data anywhere
